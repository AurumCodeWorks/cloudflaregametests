<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Card Table</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Slab:wght@600;700;800&display=swap" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/decks.css" />
  <link rel="stylesheet" href="/rooms.css" />
  <link rel="stylesheet" href="/fx.css" />
</head>
<body>
  <!-- Suit artwork and inks, referenced by every card -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="ink-red" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#c22a2f" /><stop offset="1" stop-color="#7e1016" />
      </linearGradient>
      <linearGradient id="ink-black" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#2b2b2e" /><stop offset="1" stop-color="#050506" />
      </linearGradient>
      <linearGradient id="ink-gold" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#7d5e22" /><stop offset=".35" stop-color="#d9b65e" />
        <stop offset=".5" stop-color="#fbeab0" /><stop offset=".68" stop-color="#c49a3e" /><stop offset="1" stop-color="#6f521b" />
      </linearGradient>
      <linearGradient id="ink-redfoil" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#7a1418" /><stop offset=".4" stop-color="#d9545a" />
        <stop offset=".52" stop-color="#ffb3b0" /><stop offset=".7" stop-color="#c23b42" /><stop offset="1" stop-color="#6d1015" />
      </linearGradient>
      <linearGradient id="ink-blue" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#2f62d8" /><stop offset="1" stop-color="#16348f" />
      </linearGradient>
      <linearGradient id="ink-green" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#1f9a5a" /><stop offset="1" stop-color="#0b5a32" />
      </linearGradient>
      <!-- chip rendering: lighting, cylinder shading, pearl sheen, foil glint, inlay text arc -->
      <radialGradient id="chip-sheen" cx=".32" cy=".25" r=".85">
        <stop offset="0" stop-color="#fff" stop-opacity=".28" /><stop offset=".45" stop-color="#fff" stop-opacity=".05" />
        <stop offset="1" stop-color="#000" stop-opacity=".22" />
      </radialGradient>
      <linearGradient id="chip-side" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#000" stop-opacity=".55" /><stop offset=".3" stop-color="#000" stop-opacity=".12" />
        <stop offset=".55" stop-color="#fff" stop-opacity=".12" /><stop offset="1" stop-color="#000" stop-opacity=".6" />
      </linearGradient>
      <linearGradient id="chip-pearl" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffd6f0" stop-opacity=".45" /><stop offset=".3" stop-color="#d6f0ff" stop-opacity=".35" />
        <stop offset=".55" stop-color="#fff6c8" stop-opacity=".45" /><stop offset=".8" stop-color="#d8ffe8" stop-opacity=".35" />
        <stop offset="1" stop-color="#e6d6ff" stop-opacity=".45" />
      </linearGradient>
      <linearGradient id="chip-glint" x1="-1" y1="0" x2="0" y2="0" gradientUnits="objectBoundingBox">
        <stop offset="0" stop-color="#fff" stop-opacity="0" /><stop offset=".5" stop-color="#fff" stop-opacity=".55" /><stop offset="1" stop-color="#fff" stop-opacity="0" />
        <animate attributeName="x1" values="-1;-1;1.2" keyTimes="0;.6;1" dur="4.5s" repeatCount="indefinite" />
        <animate attributeName="x2" values="0;0;2.2" keyTimes="0;.6;1" dur="4.5s" repeatCount="indefinite" />
      </linearGradient>
      <path id="chip-arc" d="M -17.5,0 A 17.5,17.5 0 0 1 17.5,0" />
      <symbol id="s-h" viewBox="0 0 100 100"><path d="M50 90C22 68 5 52 5 31 5 16 16 6 29 6c9 0 17 5 21 14 4-9 12-14 21-14 13 0 24 10 24 25 0 21-17 37-45 59z"/></symbol>
      <symbol id="s-d" viewBox="0 0 100 100"><path d="M50 3C60 22 72 37 89 50 72 63 60 78 50 97 40 78 28 63 11 50 28 37 40 22 50 3z"/></symbol>
      <symbol id="s-s" viewBox="0 0 100 100"><path d="M50 4c11 19 44 34 44 58 0 13-10 22-22 22-8 0-15-4-19-10 1 9 5 16 13 21H34c8-5 12-12 13-21-4 6-11 10-19 10C16 84 6 75 6 62 6 38 39 23 50 4z"/></symbol>
      <symbol id="s-c" viewBox="0 0 100 100"><circle cx="50" cy="27" r="19"/><circle cx="27" cy="59" r="19"/><circle cx="73" cy="59" r="19"/><circle cx="50" cy="52" r="11"/><path d="M47 60c0 15-4 26-13 35h32c-9-9-13-20-13-35z"/></symbol>
    </defs>
  </svg>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">♠</span> Card Table <span class="tag">play money</span></div>
    <div class="topbar-right">
      <div class="wallet" data-testid="wallet" hidden><span class="label">Wallet</span> <strong id="wallet-balance">0</strong></div>
      <button id="leave-btn" class="ghost" data-testid="leave" hidden>Leave table</button>
    </div>
  </header>

  <!-- Login -->
  <section id="screen-login" class="screen card-panel" hidden>
    <h1>Texas Hold'em</h1>
    <p class="muted">No-limit · 5/10 blinds · 4 seats · AI opponents fill empty seats</p>
    <form id="login-form">
      <label for="name">Display name</label>
      <input id="name" name="name" maxlength="16" required autocomplete="off" placeholder="e.g. Sam" data-testid="name" />
      <button type="submit" class="primary" data-testid="login">Get 1,000 play chips</button>
    </form>
  </section>

  <!-- Lobby -->
  <section id="screen-lobby" class="screen card-panel" hidden>
    <h1>Welcome, <span id="lobby-name"></span></h1>
    <p class="muted">Buy-in is 500 chips. You can leave between hands and your stack goes back to your wallet.</p>
    <button id="play-btn" class="primary big" data-testid="play">Take a seat</button>
  </section>

  <!-- Table -->
  <section id="screen-table" class="screen" hidden>
    <div class="table-wrap">
      <div class="felt" id="felt">
        <div class="center">
          <div id="pot-pile" class="pot-stack"></div>
          <div class="pot" data-testid="pot">Pot <strong id="pot">0</strong></div>
          <div class="board" id="board" data-testid="board"></div>
          <div class="street" id="street"></div>
        </div>
        <!-- seats are positioned around the felt; index 0 is always "you" at the bottom -->
        <div class="seat pos-0" id="seat-0"></div>
        <div class="seat pos-1" id="seat-1"></div>
        <div class="seat pos-2" id="seat-2"></div>
        <div class="seat pos-3" id="seat-3"></div>
      </div>
    </div>

    <div class="actions" id="actions" data-testid="actions">
      <div class="action-status" id="action-status"></div>
      <div class="timer" id="timer"><div class="timer-fill" id="timer-fill"></div></div>
      <div class="buttons">
        <button id="btn-fold" class="danger" data-testid="fold">Fold</button>
        <button id="btn-check" class="neutral" data-testid="check">Check</button>
        <button id="btn-call" class="neutral" data-testid="call">Call</button>
        <div class="raise-group">
          <div class="presets">
            <button class="chip-btn" data-preset="half">½ pot</button>
            <button class="chip-btn" data-preset="pot">Pot</button>
            <button class="chip-btn" data-preset="max">Max</button>
          </div>
          <input type="range" id="raise-slider" />
          <div class="raise-row">
            <input type="number" id="raise-amount" data-testid="raise-amount" />
            <button id="btn-raise" class="primary" data-testid="raise">Raise to</button>
          </div>
        </div>
      </div>
    </div>

    <aside class="side">
      <div class="fair" id="fair" data-testid="fair">
        <div class="fair-title">Provably fair shuffle</div>
        <div class="fair-body" id="fair-body">Waiting for the first hand…</div>
      </div>
      <div class="log" id="log" data-testid="log"></div>
    </aside>
  </section>

  <div class="toast" id="toast" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
